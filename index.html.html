<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10367a">
<title>Suivi sécurité — EDF BS FAB Alès</title>
<style>
  :root {
    --bg: #10367a;
    --panel: #26343f;
    --text: #f4f7fa;
    --muted: #c3ced7;
    --green: #53d769;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  main {
    width: 100vw; height: 100vh; padding: 3vh 5vw;
    display: flex; flex-direction: column; justify-content: space-between;
    text-align: center;
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 3vw; }
  .logo { background: #ffffff; border-radius: 1.2vh; padding: 1vh 1.6vw; display: flex; }
  .logo img { height: clamp(44px, 9vh, 110px); width: auto; display: block; }
  .clock { text-align: right; }
  .time { font-size: clamp(30px, 5vw, 80px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .today { font-size: clamp(14px, 1.8vw, 28px); color: var(--muted); margin-top: .8vh; }
  .saint { font-size: clamp(14px, 1.8vw, 28px); color: var(--green); font-weight: 700; margin-top: .6vh; }
  .site {
    font-size: clamp(18px, 2.6vw, 38px); letter-spacing: .08em;
    font-weight: 800; color: #ffffff; margin-top: 1.5vh;
  }
  .rule { height: 2px; background: #465563; margin: 1.4vh 0; }
  .label { font-size: clamp(20px, 3vw, 44px); font-weight: 700; line-height: 1.15; }
  .count {
    font-size: clamp(100px, min(21vw, 27vh), 300px); line-height: .95;
    font-weight: 800; color: var(--green); letter-spacing: -.04em;
  }
  .date-label { color: var(--muted); font-size: clamp(15px, 1.8vw, 26px); letter-spacing: .07em; }
  .date-value { font-size: clamp(25px, 3.6vw, 52px); font-weight: 700; margin-top: 1vh; }
  .message {
    font-size: clamp(24px, 4vw, 58px); font-weight: 800;
    color: var(--green); letter-spacing: .02em;
  }
  .small { font-size: clamp(12px, 1.1vw, 16px); color: #91a2af; margin-top: 1vh; }
  @media (max-aspect-ratio: 1/1) {
    main { padding: 3vh 5vw; }
    .topbar { flex-direction: column; gap: 1.5vh; }
    .clock { text-align: center; }
    .time { font-size: 11vw; }
    .today, .saint { font-size: 3.6vw; }
    .logo img { height: clamp(40px, 7vh, 90px); }
    .count { font-size: 26vw; }
  }
</style>
</head>

  function dateDepuisISO(iso) {
    const [annee, mois, jour] = iso.split("-").map(Number);
    return new Date(annee, mois - 1, jour);
  }

  function formaterDate(date) {
    return new Intl.DateTimeFormat("fr-FR", {
      day: "2-digit", month: "2-digit", year: "numeric"
    }).format(date);
  }

  function actualiserCompteur() {
    const dernierAccident = dateDepuisISO(DATE_DERNIER_ACCIDENT);
    const aujourdHui = new Date();
    aujourdHui.setHours(0, 0, 0, 0);

    const jours = Math.max(
      0,
      Math.floor((aujourdHui.getTime() - dernierAccident.getTime()) / 86400000)
    );

    document.getElementById("days").textContent = jours.toLocaleString("fr-FR");
    document.getElementById("lastDate").textContent = formaterDate(dernierAccident);
  }

  let jourAffiche = "";

  function actualiserHorloge() {
    const now = new Date();

    document.getElementById("time").textContent =
      now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

    const jourCle = now.toDateString();
    if (jourCle !== jourAffiche) {
      jourAffiche = jourCle;

      let txt = new Intl.DateTimeFormat("fr-FR", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      }).format(now);
      document.getElementById("today").textContent = txt.charAt(0).toUpperCase() + txt.slice(1);

      const prenom = (SAINTS[now.getMonth()] || [])[now.getDate() - 1] || "";
      document.getElementById("saint").textContent = prenom ? "Bonne fête aux " + prenom + " !" : "";

      actualiserCompteur();
    }
  }

  actualiserCompteur();
  actualiserHorloge();
  // L'heure se met à jour chaque seconde ; date, fête et compteur changent automatiquement à minuit.
  setInterval(actualiserHorloge, 1000);
  setInterval(actualiserCompteur, 60 * 60 * 1000);
